# src/main/resources/application.properties
server.port=8080
spring.application.name=product-service

# --- H2 Database Configuration ---
# Habilita la consola web de H2 para visualizar la base de datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# URL de conexión a la base de datos H2 en memoria. Los datos se perderán al reiniciar.
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA/Hibernate Configuration ---
# 'update' creará/actualizará las tablas automáticamente según tus entidades.
# Para producción, se recomienda 'validate' o 'none' y usar herramientas de migración.
spring.jpa.hibernate.ddl-auto=update
# Muestra las sentencias SQL generadas por JPA en la consola
spring.jpa.show-sql=true
# Dialecto de Hibernate para H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect